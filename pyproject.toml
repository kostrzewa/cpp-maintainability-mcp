[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainability-mcp"
version = "0.1.0"
description = "MCP server for evaluating and improving C++ maintainability"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.0",
  "lizard>=1.17",
]

[project.optional-dependencies]
clang = ["clang>=21"]
dev = ["pytest>=8", "ruff"]

[project.scripts]
maintainability-mcp = "maintainability_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
