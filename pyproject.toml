[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-maintainability-mcp"
version = "0.1.0"
description = "C++ maintainability MCP server for agent-generated code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp>=1.0",
  "lizard>=1.17",
]

[project.optional-dependencies]
clang = ["clang>=21"]
dev = ["pytest>=8", "ruff"]

[project.scripts]
cpp-maintainability-mcp = "cpp_maintainability_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
